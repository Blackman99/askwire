    <rect x="110" y="46" width="188" height="318" rx="9" fill="#2a262d" stroke="#3b3640" stroke-width="4"/>
    <g fill="#5e5862" stroke="#141216" stroke-width="2">
      <circle cx="128" cy="64" r="7"/><circle cx="280" cy="64" r="7"/><circle cx="128" cy="346" r="7"/><circle cx="280" cy="346" r="7"/>
    </g>
    <g stroke="#141216" stroke-width="2.5" stroke-linecap="round">
      <path d="M124 60l8 8M132 60l-8 8M276 60l8 8M284 60l-8 8M124 342l8 8M132 342l-8 8M276 342l8 8M284 342l-8 8"/>
    </g>
