    <circle cx="204" cy="140" r="58" fill="#141216"/>
    <circle cx="204" cy="140" r="46" fill="#e5342b"/>
    <path d="M204 104 a36 36 0 0 1 36 36" fill="none" stroke="#c42a3c" stroke-width="0"/>
    <circle cx="204" cy="140" r="46" fill="none" stroke="#a3162b" stroke-width="6"/>
    <ellipse cx="188" cy="122" rx="15" ry="10" transform="rotate(-35 188 122)" fill="#e9e4dc" opacity=".7"/>
