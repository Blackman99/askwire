    <circle cx="204" cy="270" r="46" fill="#1f1c22"/>
    <circle cx="204" cy="270" r="46" fill="#2fbf5b" opacity=".22"/>
    <ellipse cx="188" cy="252" rx="12" ry="7" transform="rotate(-35 188 252)" fill="#e9e4dc" opacity=".18"/>
