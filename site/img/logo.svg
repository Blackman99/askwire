    <rect x="374" y="300" width="36" height="42" rx="5" fill="#5e5862" stroke="#141216" stroke-width="4"/>
    <rect x="382" y="342" width="7" height="16" rx="2" fill="#b8b2a7"/>
    <rect x="395" y="342" width="7" height="16" rx="2" fill="#b8b2a7"/>
