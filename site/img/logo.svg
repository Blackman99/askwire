    <path d="M300 168 H322 A69 69 0 1 1 430 226 C404 244 392 258 392 288 V306" fill="none" stroke="#a3162b" stroke-width="22" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M318 160 A60 60 0 0 1 340 120" fill="none" stroke="#c42a3c" stroke-width="5" stroke-linecap="round"/>
