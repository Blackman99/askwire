name: New client or setup result
description: Share a run on a client, version or OS we haven't covered
labels: [results]
body:
  - type: textarea
    id: output
    attributes:
      label: askwire --markdown output
      render: markdown
    validations:
      required: true
  - type: input
    id: env
    attributes:
      label: OS and client versions
    validations:
      required: true
  - type: textarea
    id: notes
    attributes:
      label: Anything else
      description: Settings you changed, hooks you use, how you started the client.
